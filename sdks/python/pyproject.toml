[build-system]
# 77 is the first release that understands `license = "MIT"` (PEP 639). Pinning
# higher than that would needlessly break older, perfectly good toolchains.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omniengine"
version = "0.1.0"
description = "Python bindings for OmniEngine, using only the standard library's ctypes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["omni", "omniengine", "language", "interpreter", "ffi", "embed"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Interpreters",
]

# Deliberately empty, and load-bearing: the whole point of this SDK is that
# adding OmniEngine to a project cannot change that project's dependency tree.
# A wheel does carry a native library, but it is data copied into the package,
# not a Python dependency.
dependencies = []

[project.urls]
Homepage = "https://github.com/fahim5536/OmniEngine"
Repository = "https://github.com/fahim5536/OmniEngine"
Documentation = "https://github.com/fahim5536/OmniEngine/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/fahim5536/OmniEngine/releases"

[tool.setuptools.packages.find]
include = ["omni*"]

# Where a release wheel puts the engine. setup.py's build_py stages the file
# from a release build of the tagged commit; a checkout install falls back to
# finding target/ at run time, and OMNI_ENGINE_LIBRARY overrides both.
[tool.setuptools.package-data]
omni = ["_native/*"]

[package]
name = "omni-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"

# `cargo fuzz` looks for this marker when it initialises a project.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
omni-core = { path = ".." }

# Its own workspace, so the repository's stable build and test commands never
# resolve this package, its nightly target, or its dependency.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_lex"
path = "fuzz_targets/fuzz_lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lower"
path = "fuzz_targets/fuzz_lower.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vm"
path = "fuzz_targets/fuzz_vm.rs"
test = false
doc = false
bench = false

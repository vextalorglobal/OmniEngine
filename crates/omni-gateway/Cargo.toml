[package]
name = "omni-gateway"
description = "TLS REST gateway for policy-bounded OmniEngine execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
omni-core.workspace = true
omni-cluster.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
fs2 = "0.4"
rcgen = "0.13"
mlua = { version = "0.11.4", default-features = false, features = ["lua54", "vendored"] }
wasmi = "0.46.0"

[[bin]]
name = "omni-gateway"
path = "src/main.rs"

[[bin]]
name = "omni-gateway-dev-cert"
path = "src/bin/dev-cert.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
